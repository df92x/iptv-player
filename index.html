<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPTV Player</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<meta name="theme-color" content="#0d0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root { --bg:#0d0f12; --panel:#12151a; --surface:#1c2027; --line:#272c34; --text:#ece8e1; --dim:#8a919c; --acc:#ffb43a; --acc-ink:#1a1203; --star:#ffb43a; --live:#ff5a52;
          --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body { height: 100dvh; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 'IBM Plex Sans', system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header input { flex: 1; min-width: 0; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
  button.ghost { background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 400; }
  @media (max-width: 760px) {
    header { padding: 8px; gap: 6px; }
    header nav.top button { padding: 0 7px; font-size: 13px; }
    .brand { gap: 6px; margin-right: 0; }
    .brand svg { width: 22px; height: 22px; }
    .brand b { font-size: 19px; letter-spacing: .03em; }
  }
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; min-width: 0; }
  aside { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; min-width: 0; background: var(--panel); }
  .filters { display: flex; gap: 8px; padding: 10px; }
  .filters select, .filters input { flex: 1; min-width: 0; }
  #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ch:hover { background: var(--surface); }
  .ch.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--acc); }
  .tile { position: relative; width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--dim); }
  .tile::before { content: attr(data-i); }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--bg); }
  .ch.on .tile { color: var(--acc); }
  .ch span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .star { background: none; border: 0; color: var(--dim); font-size: 22px; padding: 0 4px; line-height: 1; font-weight: 400; }
  .star.on { color: var(--star); }
  #stage { display: flex; flex-direction: column; min-width: 0; background: #000; }
  video { width: 100%; max-width: 100%; flex: 1 1 0; height: 0; min-height: 0; min-width: 0; background: #000; }
  #stage { min-height: 0; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); min-height: 46px; }
  #info { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #info b { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .st { display: block; font-size: 13px; color: var(--acc); }
  #info small { display: block; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info small span { color: var(--acc); margin-right: 8px; font-weight: 600; }
  #pip { flex: none; padding: 7px 12px; }
  #info b { color: var(--text); }
  .empty { padding: 20px; color: var(--dim); text-align: center; }
  .sec { padding: 14px 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .ch { transition: transform .12s; min-height: 48px; }
  button, select, input:not([type=range]) { min-height: 44px; }
  .star { min-width: 44px; }
  .grip { min-width: 36px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  #lists .x { min-width: 44px; min-height: 44px; }
  body.native #bar #pip, body.native #bar #fs { display: none; }   /* w aplikacji te przyciski są na nakładce odtwarzacza */
  header nav.top { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  header nav.top button { min-height: 0; height: 30px; padding: 0 10px; font-size: 15px; line-height: 1; white-space: nowrap; }
  #settings { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #settings[hidden] { display: none; }
  #settings .sheet { max-width: 560px; margin: 0 auto; padding: 0 12px 28px; }
  #settings .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; position: sticky; top: 0; background: var(--bg); }
  #settings h2 { margin: 0; font-size: 20px; }
  #settings h3 { margin: 18px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  #settings .add { display: flex; gap: 8px; margin-top: 10px; }
  #settings .add input { flex: 1; min-width: 0; }
  #settings .wide { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .grip { flex: none; color: var(--dim); font-size: 18px; line-height: 1; padding: 6px 4px; cursor: grab; touch-action: none; user-select: none; }
  .ch.drag { position: relative; z-index: 3; transition: none; background: #2a3646; box-shadow: 0 4px 14px #0008; cursor: grabbing; }
  #stage { position: relative; }
  #lists { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #lists .empty { padding: 14px 12px; }
  #lists .li .on { color: var(--acc); font-weight: 600; margin-left: 8px; }
  #lists .li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #lists .li:last-child { border-bottom: 0; }
  #lists .li:hover { background: #222933; }
  #lists .li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lists .li .t small { display: block; color: var(--dim); }
  #lists .x { flex: none; background: none; border: 0; color: var(--dim); font-size: 18px; padding: 4px 8px; font-weight: 400; }
  #lists .x:hover { color: #ff6b6b; }
  .ch:focus, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
  body.fs header, body.fs aside, body.fs #bar { display: none; }
  body.fs main { display: block; }
  body.fs #stage { position: fixed; inset: 0; z-index: 10; }
  body.fs video { width: 100%; height: 100%; aspect-ratio: auto; flex: 1; }
  html.native, html.native body { background: transparent; }
  body.native #stage, body.native video { background: transparent; }
  #pp { display: none; }
  body.native .web-only { display: none; }
  body.native #pp { display: block; }
  #dvr { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; display: none; padding: 10px; border-radius: 14px; background: #000c; color: #fff; }
  body.native #dvr.show { display: block; }
  #dvr .r { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #dvr button { flex: 1 1 0; min-width: 56px; padding: 9px 4px; background: #ffffff1a; color: #fff; border: 1px solid #ffffff22; font-weight: 600; }
  #dvr button.live { background: var(--live); border-color: var(--live); color: #1a0605; }
  #dvr button.live.on { background: #2e9e57; border-color: #2e9e57; color: #04170b; }
  #dvr select { flex: 1 1 0; min-width: 90px; padding: 8px 4px; background: #ffffff1a; color: #fff; border: 1px solid #ffffff22; border-radius: 8px; }
  #dvr select option { color: #000; }
  #dvr input[type=range] { width: 100%; margin: 10px 0 2px; accent-color: var(--acc); }
  #dvr .lab { font-size: 14px; color: #fff; text-align: center; font-weight: 600; text-shadow: 0 1px 2px #000; }
  body.native #dvr { background: #000d; padding: 8px; }
  body.native #dvr button { font-size: 20px; line-height: 1; min-height: 44px; }
  body.native #dvr button.live { font-size: 14px; }
  #dvr.nodvr .rw, #dvr.nodvr input, #dvr.nodvr .live { display: none; }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: 80%; padding: 8px 14px; border-radius: 20px; background: #000b; color: #fff; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; color: var(--acc); }
  .brand b { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .brand b i { font-style: normal; color: var(--acc); }
  header { align-items: center; }
  .chips { display: none; gap: 8px; padding: 0 10px 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 0 16px; border-radius: 22px; background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 400; }
  .chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
  /* panel cofania pod odtwarzaczem (przeglądarka); w aplikacji to nakładka na wideo */
  body:not(.native) #dvr { position: static; display: block; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0; padding: 12px 14px; }
  body:not(.native):not(.playing) #dvr, body:not(.native).fs #dvr { display: none; }
  body:not(.native) #bar { order: 1; }
  body:not(.native) #dvr { order: 2; }
  body:not(.native) #dvrpp, body:not(.native) #dvrstop, body:not(.native) #dvrpip, body:not(.native) #dvrfs { display: none; }
  body:not(.native) #dvr .lab { text-align: left; }
  /* Android TV: duże wiersze i wyraźny fokus */
  body.tv { font-size: 20px; }
  body.tv main { grid-template-columns: 420px minmax(0, 1fr); }
  body.tv .ch { min-height: 72px; font-size: 24px; padding: 0 16px; }
  body.tv .tile { width: 52px; height: 52px; font-size: 22px; }
  body.tv #info b { font-size: 40px; }
  body.tv .ch:focus, body.tv button:focus-visible { outline-width: 4px; }
  body.tv .brand b { font-size: 32px; }
  @media (max-width: 760px) {
    .brand { flex: none; }
    .chips { display: flex; }
    .filters #group { display: none; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #stage { order: -1; }
    video { aspect-ratio: 16/9; flex: none; height: auto; }
    aside { border-right: 0; }
    /* panel cofania: kompaktowo, żeby lista kanałów zostawała widoczna */
    body:not(.native) #dvr { padding: 8px 10px; }
    #dvr [data-d="-300"], #dvr [data-d="300"], #dvr [data-d="-30"], #dvr [data-d="30"], body:not(.native) #dvr .lab { display: none; }
    #dvr input[type=range] { margin: 6px 0; }
  }
  /* telefon poziomo podczas oglądania: obraz na cały ekran */
  @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
    body.playing header, body.playing aside, body.playing #bar { display: none; }
    body.playing main { display: block; }
    body.playing #stage { position: fixed; inset: 0; z-index: 10; }
    body.playing video { width: 100%; height: 100%; aspect-ratio: auto; flex: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2.5"/><path d="M8 3l4 4 4-4"/></svg>
    <b>IPTV <i>Player</i></b>
  </div>
  <nav class="top">
    <button id="set" class="ghost" title="Listy, kopia ulubionych" aria-haspopup="dialog">⚙ Ustawienia</button>
  </nav>
</header>
<main>
  <aside>
    <div class="filters">
      <select id="group" aria-label="Grupa kanałów"></select>
      <input id="q" type="search" placeholder="Szukaj…" aria-label="Szukaj kanału">
    </div>
    <div id="chips" class="chips" aria-label="Grupy kanałów"></div>
    <div id="list"><div class="empty">Otwórz Ustawienia, aby dodać playlistę lub włączyć listę publiczną.</div></div>
  </aside>
  <section id="stage">
    <video id="v" controls controlsList="nofullscreen" playsinline autoplay poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    <div id="toast"></div>
    <div id="dvr">
      <div class="r rw">
        <button data-d="-300">−5 min</button><button data-d="-60">−60 s</button><button data-d="-30">−30 s</button><button data-d="-10">−10 s</button>
        <button data-d="10">+10 s</button><button data-d="30">+30 s</button><button data-d="300">+5 min</button>
      </div>
      <input id="dvrs" type="range" min="0" max="1" step="1" value="1" aria-label="Pozycja w buforze cofania">
      <div class="r">
        <button id="dvrpp" aria-label="Odtwarzaj lub wstrzymaj">⏯</button>
        <button id="dvrstop" aria-label="Zatrzymaj">⏹</button>
        <button id="dvrpip" aria-label="Obraz w obrazie" title="Obraz w obrazie">⧉</button>
        <button id="dvrfs" aria-label="Pełny ekran" title="Pełny ekran">⛶</button>
        <span class="lab" id="dvrl" style="flex:3">NA ŻYWO</span>
        <button class="live on" id="dvrlive">● NA ŻYWO</button>
      </div>
    </div>
    <div id="bar"><div id="info">Wybierz kanał z listy.</div><button id="pip" class="ghost" hidden>Obraz w obrazie</button>
    <button id="fs" class="ghost" title="Pełny ekran" aria-label="Pełny ekran">⛶</button></div>
  </section>
</main>
<div id="settings" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="sheet">
    <div class="sh-head"><h2 id="set-title">Ustawienia</h2><button id="set-close" class="ghost" aria-label="Zamknij ustawienia">✕</button></div>
    <h3>Moje listy</h3>
    <div id="lists"></div>
    <div class="add">
      <input id="url" type="url" placeholder="Wklej link do playlisty .m3u / .m3u8" autocomplete="off" aria-label="Link do nowej playlisty">
      <button id="load">Dodaj</button>
    </div>
    <h3>Kopia i pliki</h3>
    <button id="m-file" class="ghost wide">Wczytaj plik (playlista lub kopia ulubionych)…</button>
    <button id="m-save" class="ghost wide">Zapisz kopię ulubionych</button>
  </div>
</div>
<input id="file" type="file" accept=".m3u,.m3u8,.txt,.json" hidden>

<script src="hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
// aplikacja Android z odtwarzaczem VLC (plugin Capacitora NativePlayer)
const NP = (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.NativePlayer) || null;
const NATIVE = !!NP;
if (NATIVE) { document.documentElement.classList.add('native'); document.body.classList.add('native'); }
if (/Android.*(\bTV\b|AFT|BRAVIA|SHIELD|MIBOX)|Leanback/i.test(navigator.userAgent)) document.body.classList.add('tv');
const FAV = '★ Ulubione', ALL = 'Wszystkie';
let state = { urls: [], favorites: [], recent: [], last: '' };   // favorites: {key,name,url,logo,group}
let channels = [], group = ALL, current = null, hls = null;

/* ---------- zapis stanu: tylko localStorage tej przeglądarki (nic nie trafia na serwer) ---------- */
function loadState() {
  try { state = JSON.parse(localStorage.getItem('iptv') || '') || state; } catch {}
  state.urls = state.urls || []; state.favorites = state.favorites || []; state.recent = state.recent || [];
}
function saveState() {
  try { localStorage.setItem('iptv', JSON.stringify(state)); } catch {}
}
// strona po HTTPS nie może odtwarzać http:// — próbujemy wersji https
const secure = u => !NATIVE && location.protocol === 'https:' ? u.replace(/^http:\/\//i, 'https://') : u;

/* ---------- parser M3U ---------- */
function parseM3U(text) {
  const out = []; let meta = null, grp = '';
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')) {
      const attr = k => (line.match(new RegExp(k + '="([^"]*)"', 'i')) || [])[1] || '';
      const name = line.includes(',') ? line.slice(line.lastIndexOf(',') + 1).trim() : '';
      meta = { name: name || attr('tvg-name'), logo: attr('tvg-logo'), id: attr('tvg-id'), group: attr('group-title') || grp };
    } else if (line.startsWith('#EXTGRP:')) {
      grp = line.slice(8).trim(); if (meta) meta.group = meta.group || grp;
    } else if (line.startsWith('#EXTVLCOPT') || line[0] === '#') {
      continue;
    } else if (meta) {
      meta.url = line; meta.key = meta.id || meta.name; meta.group = meta.group || 'Inne';
      out.push(meta); meta = null;
    }
  }
  return out;
}

/* ---------- wczytywanie playlisty ---------- */
async function loadPlaylist(url, pub = false) {
  url = url.trim(); if (!url) return;
  $('list').innerHTML = '<div class="empty">Wczytuję…</div>';
  url = secure(url);
  state.pub = pub;
  let text;
  try {
    if (NATIVE && /^https?:\/\//i.test(url)) {
      text = (await NP.fetchText({ url })).text;
      if (!text) throw new Error('brak odpowiedzi serwera');
    } else {
    const r = await fetch(url);                                      // bezpośrednio (dostawca ma CORS)
    if (!r.ok) throw new Error('HTTP ' + r.status);
    text = await r.text();
    }
  } catch (e) { $('list').innerHTML = '<div class="empty">Nie udało się pobrać playlisty: ' + e.message + '</div>'; return; }
  if (!pub) rememberUrl(url); else saveState();
  openText(text, url);
}
function openText(text, url) {
  if (/#EXT-X-(TARGETDURATION|STREAM-INF)/.test(text)) {          // to pojedynczy strumień, nie lista kanałów
    channels = [{ name: 'Strumień', url, group: 'Inne', key: url, logo: '' }];
  } else {
    channels = parseM3U(text);
    channels.forEach(c => { c.url = secure(c.url); c.logo = secure(c.logo); });
    const tvg = (text.match(/url-tvg="([^"]+)"/i) || [])[1];            // program TV z nagłówka playlisty
    if (NATIVE && tvg) NP.epgSource({ url: secure(tvg) }).catch(() => {});
    if (!channels.length) { $('list').innerHTML = '<div class="empty">Brak kanałów w tej playlistce.</div>'; return; }
    // odśwież adresy ulubionych (tokeny) na podstawie świeżej playlisty
    const byKey = new Map(channels.map(c => [c.key, c]));
    [...state.favorites, ...state.recent].forEach(f => { const c = byKey.get(f.key); if (c) Object.assign(f, { url: c.url, logo: c.logo }); });
    saveState();
  }
  const last = channels.find(c => c.key === state.last);
  const pl = channels.find(c => isPoland(c.group));
  group = pl ? pl.group : last ? last.group : state.favorites.length ? FAV : ALL;
  renderGroups(); renderList();
  if (channels.length === 1) play(channels[0]);
  else if (last) { play(last); const on = $('list').querySelector('.ch.on'); if (on) on.scrollIntoView({ block: 'center' }); }
}
function rememberUrl(url) {
  state.urls = [url, ...state.urls.filter(u => u !== url)].slice(0, 50);
  saveState(); renderRecent();
}
function listLabel(u) {            // bez tokenu w query — tylko host i ścieżka
  try { const x = new URL(u, location.href); return { host: x.hostname, path: (x.pathname + '').replace(/\/$/, '').slice(-40) }; }
  catch { return { host: u.slice(0, 40), path: '' }; }
}
function renderRecent() {
  const box = $('lists');
  box.innerHTML = '';
  const row = (title, sub, active, pick, remove) => {
    const d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = '<span class="t">' + esc(title) + (active ? '<span class="on">✓ aktywna</span>' : '') + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      (remove ? '<button class="x" title="Usuń playlistę" aria-label="Usuń playlistę">✕</button>' : '');
    d.onclick = pick;
    if (remove) d.querySelector('.x').onclick = e => { e.stopPropagation(); remove(); };
    box.appendChild(d);
  };
  row('Lista publiczna', 'Darmowe kanały z całego świata', state.pub, () => { closeSettings(); loadPlaylist('public-channels.m3u', true); });
  state.urls.forEach((u, i) => {
    const l = listLabel(u);
    row(l.host, l.path, !state.pub && i === 0, () => { closeSettings(); loadPlaylist(u); },
      () => { state.urls = state.urls.filter(x => x !== u); saveState(); renderRecent(); });
  });
  if (!state.urls.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Brak własnych playlist — wklej link poniżej i kliknij „Dodaj”.'; box.appendChild(e); }
}

/* ---------- UI ---------- */
const isFav = c => state.favorites.some(f => f.key === c.key);
const MIN_GROUP = 10;
const isPoland = g => ['poland', 'polska', 'polskie', 'polish', 'pl'].includes(g.replace(/^\d+\.\s*/, '').trim().toLowerCase());
function renderGroups() {
  const counts = new Map();
  channels.forEach(c => counts.set(c.group, (counts.get(c.group) || 0) + 1));
  // ukrywamy małe grupy (kanały nadal są w „Wszystkie” i w wyszukiwarce), o ile istnieje choć jedna duża
  const hasBig = [...counts.values()].some(n => n >= MIN_GROUP);
  const names = [...counts.keys()]
    .filter(g => !hasBig || counts.get(g) >= MIN_GROUP || g === group || isPoland(g))
    .sort((x, y) => (isPoland(y) - isPoland(x)) || x.localeCompare(y, undefined, { numeric: true }));
  const opts = [FAV, ALL, ...names];
  if (!opts.includes(group)) group = ALL;
  $('group').innerHTML = opts.map(g => {
    const n = g === FAV ? state.favorites.length : g === ALL ? channels.length : counts.get(g);
    return `<option value="${esc(g)}"${g === group ? ' selected' : ''}>${esc(g)} (${n})</option>`;
  }).join('');
  $('chips').innerHTML = [FAV, ...names.filter(isPoland), ALL, ...names.filter(g => !isPoland(g))].slice(0, 10).map(g =>
    `<button class="chip${g === group ? ' on' : ''}" data-g="${esc(g)}">${esc(g.replace(/^\d+\.\s*/, ''))}</button>`).join('');
}
function visible() {
  const q = $('q').value.trim().toLowerCase();
  let list = group === FAV ? state.favorites : group === ALL ? channels : channels.filter(c => c.group === group);
  return q ? list.filter(c => c.name.toLowerCase().includes(q)) : list;
}
function renderList() {
  const box = $('list'), q = $('q').value.trim();
  const list = visible();
  const recent = group === FAV && !q ? state.recent : [];
  if (!list.length && !recent.length) { box.innerHTML = '<div class="empty">' + (group === FAV ? 'Brak ulubionych — kliknij ☆ przy kanale.' : 'Brak wyników.') + '</div>'; return; }
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  const title = t => { const d = document.createElement('div'); d.className = 'sec'; d.textContent = t; return d; };
  if (recent.length) { frag.appendChild(title('Ostatnio oglądane')); recent.forEach(c => frag.appendChild(row(c, false))); if (list.length) frag.appendChild(title('Ulubione')); }
  const sortable = group === FAV && !q;
  const LIMIT = 700;
  list.slice(0, LIMIT).forEach((c, i) => frag.appendChild(row(c, sortable, i)));
  if (list.length > LIMIT) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Pokazano ' + LIMIT + ' z ' + list.length + ' — zawęź grupą lub wyszukiwarką.'; frag.appendChild(d); }
  box.appendChild(frag);
}
function row(c, sortable, idx) {
  const d = document.createElement('div');
  d.className = 'ch' + (current && current.key === c.key ? ' on' : '');
  d.innerHTML = (sortable ? '<span class="grip" role="img" aria-label="Przeciągnij, aby zmienić kolejność" title="Przeciągnij, aby zmienić kolejność">⋮⋮</span>' : '') +
    `<span class="tile" data-i="${esc(initials(c.name))}"><img loading="lazy" alt="" src="${esc(c.logo || '')}" onerror="this.remove()"></span><span class="n">${esc(c.name)}</span><button class="star${isFav(c) ? ' on' : ''}" aria-pressed="${isFav(c)}" aria-label="${isFav(c) ? 'Usuń z ulubionych' : 'Dodaj do ulubionych'}: ${esc(c.name)}">${isFav(c) ? '★' : '☆'}</button>`;
  d.tabIndex = 0;
  d.onkeydown = e => { if (e.target === d && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); play(c); } };
  d.onclick = () => play(c);
  d.querySelector('.star').onclick = e => { e.stopPropagation(); toggleFav(c); };
  if (sortable) { d.dataset.idx = idx; const g = d.querySelector('.grip'); g.onpointerdown = e => startDrag(e, d); g.onclick = e => e.stopPropagation(); }
  return d;
}

/* ---------- przeciąganie ulubionych ---------- */
function startDrag(e, rowEl) {
  e.preventDefault(); e.stopPropagation();
  const grip = e.currentTarget, from = +rowEl.dataset.idx;
  const rows = [...$('list').querySelectorAll('.ch')].filter(r => r.dataset.idx !== undefined);
  const mids = rows.map(r => r.offsetTop + r.offsetHeight / 2), h = rowEl.offsetHeight;
  const startY = e.clientY, startScroll = $('list').scrollTop;
  let to = from;
  grip.setPointerCapture(e.pointerId);
  rowEl.classList.add('drag');
  const move = ev => {
    const dy = ev.clientY - startY + ($('list').scrollTop - startScroll);
    rowEl.style.transform = 'translateY(' + dy + 'px)';
    const pos = mids[from] + dy;
    to = mids.reduce((best, m, i) => Math.abs(m - pos) < Math.abs(mids[best] - pos) ? i : best, 0);
    rows.forEach((r, i) => {
      if (i === from) return;
      r.style.transform = from < to && i > from && i <= to ? 'translateY(' + -h + 'px)' : to < from && i >= to && i < from ? 'translateY(' + h + 'px)' : '';
    });
  };
  const up = () => {
    grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
    if (to !== from) { const [m] = state.favorites.splice(from, 1); state.favorites.splice(to, 0, m); saveState(); }
    renderList();
  };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
}
function toggleFav(c) {
  if (isFav(c)) state.favorites = state.favorites.filter(f => f.key !== c.key);
  else state.favorites.push({ key: c.key, name: c.name, url: c.url, logo: c.logo, group: c.group });
  saveState(); renderGroups(); renderList();
}
const initials = n => {
  const t = String(n).replace(/^[A-Za-z]{2}:\s*/, '').replace(/\(.*?\)/g, '').trim();
  const w = t.split(/\s+/).filter(Boolean);
  return (w.length >= 2 ? w.slice(0, 3).map(x => x[0]).join('') : t.slice(0, 3)).toUpperCase();
};
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

/* ---------- odtwarzanie ---------- */
function play(c, attempt = 0) {
  current = c;
  if (channels.length > 1) {
    state.last = c.key;
    state.recent = [{ key: c.key, name: c.name, url: c.url, logo: c.logo, group: c.group }, ...state.recent.filter(r => r.key !== c.key)].slice(0, 3);
    saveState();
  }
  document.body.classList.add('playing');
  const v = $('v');
  const say = t => $('info').innerHTML = '<b>' + esc(c.name) + '</b>' + (t ? '<span class="st">' + t + '</span>' : '');
  say('ładowanie…');
  if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute('src');
  if (NATIVE) { audioInfo = ''; NP.play({ url: c.url, dvr: dvrSeconds() }).catch(() => {}); syncRect(); renderList(); return; }
  const safari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
  if (!safari && window.Hls && Hls.isSupported()) {
    const h = hls = new Hls({ lowLatencyMode: false, backBufferLength: Infinity, liveBackBufferLength: Infinity, maxMaxBufferLength: 60 });
    h.loadSource(c.url); h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
    h.on(Hls.Events.FRAG_BUFFERED, () => say(''));
    h.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal || h !== hls) return;
      // błędy dekodera/sieci: do 3 pełnych prób od początku, potem komunikat
      if (attempt < 3) { say('ponawiam (' + (attempt + 1) + '/3)…'); setTimeout(() => current === c && play(c, attempt + 1), 800); }
      else say('nie udało się odtworzyć (' + esc(d.details) + ')');
    });
  } else {                                                          // iPhone/iPad Safari: natywne HLS
    v.src = c.url; v.play().catch(() => {});
    $('info').innerHTML = '<b>' + esc(c.name) + '</b>';
  }
  renderList();
}

/* ---------- zdarzenia ---------- */
const settings = $('settings');
function openSettings() { renderRecent(); settings.hidden = false; $('set-close').focus(); }
function closeSettings() { settings.hidden = true; }
function addPlaylist() {
  const u = $('url').value.trim();
  if (!u) return;
  $('url').value = '';
  closeSettings();
  loadPlaylist(u);
}
$('set').onclick = openSettings;
$('set-close').onclick = closeSettings;
$('load').onclick = addPlaylist;
$('url').addEventListener('keydown', e => e.key === 'Enter' && addPlaylist());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !settings.hidden) closeSettings(); });
$('group').onchange = e => { group = e.target.value; renderList(); };
$('chips').onclick = e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  group = b.dataset.g; renderGroups(); renderList();
};
$('q').oninput = renderList;

/* ---------- poprzedni / następny kanał ---------- */
function step(dir) {
  const list = visible();
  if (!list.length) return;
  const i = current ? list.findIndex(c => c.key === current.key) : -1;
  const next = i < 0 ? list[0] : list[(i + dir + list.length) % list.length];
  play(next);
  const t = $('toast'); t.textContent = (dir > 0 ? '▶ ' : '◀ ') + next.name; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400);
  const on = $('list').querySelector('.ch.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
let sx = null, sy = 0, st = 0;
$('v').addEventListener('touchstart', e => {
  const t = e.touches[0], r = e.currentTarget.getBoundingClientRect();
  if (e.touches.length !== 1 || t.clientY > r.bottom - 60) { sx = null; return; }     // dolny pasek to kontrolki odtwarzacza
  sx = t.clientX; sy = t.clientY; st = Date.now();
}, { passive: true });
$('v').addEventListener('touchend', e => {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && Date.now() - st < 800) step(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'PageDown') step(1);
  if (e.key === 'PageUp') step(-1);
});

/* ---------- pełny ekran po obróceniu telefonu ---------- */
matchMedia('(orientation: landscape)').addEventListener('change', e => {
  if (!document.body.classList.contains('playing') || !matchMedia('(pointer: coarse)').matches) return;
  setFs(e.matches);                       // poziomo = pełny ekran, pionowo = powrót do listy
});

/* ---------- pełny ekran (przycisk, Esc, Wstecz w aplikacji) ---------- */
function setFs(on) {
  document.body.classList.toggle('fs', on);
  if (NATIVE) NP.immersive({ on }).catch(() => {});
  const st = $('stage');
  if (NATIVE) { setTimeout(syncRect, 50); }
  else if (on) { st.requestFullscreen && st.requestFullscreen().catch(() => {}); }
  else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
$('fs').onclick = () => setFs(!document.body.classList.contains('fs'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { document.body.classList.remove('fs'); if (NATIVE) NP.immersive({ on: false }).catch(() => {}); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('fs')) setFs(false); });
try {
  const App = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
  if (App) App.addListener('backButton', () => {
    if (document.body.classList.contains('fs')) setFs(false);
    else if (!$('settings').hidden) $('settings').hidden = true;
    else App.exitApp();
  });
} catch {}

/* ---------- cofanie w przeglądarce ----------
   hls.js zawęża seekable do okna playlisty dostawcy (~36 s). Wyłączamy to, więc cofać można w całym
   materiale, który przeglądarka trzyma w buforze (zwykle kilka minut). */
if (!NATIVE && window.MediaSource && MediaSource.prototype.setLiveSeekableRange) {
  MediaSource.prototype.setLiveSeekableRange = function () {};
}
if (!NATIVE) {
  const v = $('v'), slider = $('dvrs'), lab = $('dvrl'), liveBtn = $('dvrlive');
  let drag = false;
  const range = () => v.buffered.length ? [v.buffered.start(0), v.buffered.end(v.buffered.length - 1)] : null;
  const fmt = sec => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  document.querySelectorAll('#dvr button[data-d]').forEach(btn => btn.onclick = () => {
    const r = range(); if (!r) return;
    v.currentTime = Math.min(r[1] - 1, Math.max(r[0], v.currentTime + (+btn.dataset.d)));
  });
  liveBtn.onclick = () => {
    const r = range(); if (!r) return;
    v.currentTime = r[1] - 1;
    v.play().catch(() => {});
  };
  slider.addEventListener('input', () => { drag = true; });
  slider.addEventListener('change', () => { const r = range(); if (r) v.currentTime = r[0] + (+slider.value); drag = false; });
  setInterval(() => {
    const r = range();
    if (!r || drag) return;
    const span = Math.max(1, Math.floor(r[1] - r[0]));
    slider.max = span;
    slider.value = Math.max(0, Math.min(span, Math.round(v.currentTime - r[0])));
    const behind = Math.max(0, r[1] - v.currentTime);
    const live = behind < 8;
    liveBtn.classList.toggle('on', live);
    lab.textContent = live ? 'NA ŻYWO (bufor ' + fmt(span) + ')' : '−' + fmt(behind) + ' za transmisją';
  }, 500);
}

/* ---------- natywny odtwarzacz (aplikacja Android) ---------- */
let lastRect = '', audioInfo = '';
function dvrSeconds() { return 300; }   // bufor cofania: stałe 5 min
function syncRect() {
  if (!NATIVE) return;
  const r = $('v').getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const sb = $('stage').getBoundingClientRect();           // nakładka przy dolnej krawędzi obrazu, nie całego bloku z paskiem nazwy
  $('dvr').style.bottom = Math.max(8, Math.round(sb.bottom - r.bottom + 8)) + 'px';
  const key = [r.left, r.top, r.width, r.height, d].map(n => Math.round(n * d)).join(',');
  if (key === lastRect) return;
  lastRect = key;
  NP.setRect({ x: Math.round(r.left * d), y: Math.round(r.top * d), w: Math.round(r.width * d), h: Math.round(r.height * d) }).catch(() => {});
}
if (NATIVE) {
  $('v').removeAttribute('controls');
  let nstate = 'playing', stopped = false;
  let epgKey = '', epgAt = 0, epgNow = null, epgNext = null;
  const hm = ms => new Date(ms).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
  const paint = () => {
    if (!current) return;
    const t = { playing: '', buffering: 'buforowanie…', paused: 'pauza', stopped: 'zatrzymano', error: 'nie udało się odtworzyć', ended: 'koniec transmisji' }[nstate] || '';
    const line = (lbl, p) => p ? '<small><span>' + lbl + '</span>' + hm(p.s) + ' ' + esc(p.t) + '</small>' : '';
    const epg = epgKey === current.key ? line('Teraz', epgNow) + line('Dalej', epgNext) : '';
    $('info').innerHTML = '<b>' + esc(current.name) + '</b>' + (t ? '<span class="st">' + t + '</span>' : '') + epg;
  };
  NP.addListener('state', e => {
    if (e.state === 'resync') { lastRect = ''; syncRect(); return; }   // po powrocie z obrazu w obrazie / z tła
    if (e.state === 'info') return;                                    // szczegóły techniczne nie są pokazywane
    nstate = e.state;
    if (e.state === 'playing') stopped = false;
    paint();
  });
  // program TV: co leci teraz i co dalej (dane z url-tvg playlisty, pobierane natywnie)
  setInterval(async () => {
    if (!current) return;
    const k = current.key;
    if (k === epgKey && Date.now() - epgAt < 60000) return;
    if (k !== epgKey) { epgNow = epgNext = null; }
    epgKey = k; epgAt = Date.now();
    try {
      const r = await NP.epg({ id: k });
      if (current.key !== k) return;
      epgNow = r.now || null; epgNext = r.next || null;
      paint();
    } catch {}
  }, 3000);
  new ResizeObserver(syncRect).observe($('v'));
  new ResizeObserver(syncRect).observe(document.body);
  addEventListener('resize', syncRect);
  setInterval(syncRect, 400);

  // nakładka z odtwarzaniem i cofaniem: dotknięcie obrazu pokazuje/ukrywa ją
  const dvr = $('dvr'), slider = $('dvrs'), lab = $('dvrl'), liveBtn = $('dvrlive');
  let hideT = 0, dragging = false, buffered = 0;
  const showDvr = () => { dvr.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => { if (!dragging) dvr.classList.remove('show'); }, 6000); };
  const fmt = sec => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  $('v').addEventListener('click', () => dvr.classList.contains('show') ? dvr.classList.remove('show') : showDvr());
  dvr.querySelectorAll('button[data-d]').forEach(b => b.onclick = () => { NP.seekBy({ delta: +b.dataset.d }).catch(() => {}); showDvr(); });
  liveBtn.onclick = () => { NP.goLive().catch(() => {}); showDvr(); };
  $('dvrpp').onclick = () => {
    if (stopped && current) { stopped = false; play(current); }        // po „stop" start od nowa
    else NP.toggle().catch(() => {});
    showDvr();
  };
  $('dvrpip').onclick = () => { NP.enterPip().catch(() => {}); showDvr(); };
  $('dvrfs').onclick = () => $('fs').click();
  $('dvrstop').onclick = () => {
    if (!current) return;
    stopped = true; nstate = 'stopped';
    NP.stop().catch(() => {});
    paint(); showDvr();
  };
  slider.addEventListener('input', () => { dragging = true; showDvr(); lab.textContent = '−' + fmt(buffered - slider.value) + ' za transmisją'; });
  slider.addEventListener('change', () => { dragging = false; NP.seekTo({ behind: buffered - slider.value }).catch(() => {}); showDvr(); });
  setInterval(async () => {
    if (!current) return;
    try {
      const st = await NP.dvrState();
      dvr.classList.toggle('nodvr', !st.available);
      if (dragging) return;
      buffered = Math.max(1, Math.floor(st.buffered));
      slider.max = buffered;
      slider.value = Math.max(0, buffered - Math.round(st.behind));
      liveBtn.classList.toggle('on', st.live || st.behind < 10);
      lab.textContent = !st.available ? 'bez cofania'
        : st.behind < 10 ? 'NA ŻYWO' : '−' + fmt(st.behind) + ' za transmisją';
    } catch {}
  }, 1000);
}

/* ---------- obraz w obrazie ---------- */
const pipBtn = $('pip'), vid = $('v');
if (NATIVE || document.pictureInPictureEnabled || vid.webkitSupportsPresentationMode) pipBtn.hidden = false;
pipBtn.onclick = async () => {
  if (NATIVE) { NP.enterPip().catch(() => {}); return; }
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (document.pictureInPictureEnabled) await vid.requestPictureInPicture();
    else vid.webkitSetPresentationMode(vid.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
  } catch (e) { alert('Obraz w obrazie niedostępny: ' + e.message); }
};

$('m-file').onclick = () => { closeSettings(); $('file').click(); };
$('m-save').onclick = () => {
  closeSettings();
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const l = document.createElement('a');
  l.href = URL.createObjectURL(blob); l.download = 'iptv-backup.json'; l.click();
  setTimeout(() => URL.revokeObjectURL(l.href), 1000);
};
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const t = await f.text();
  try { const j = JSON.parse(t); if (j.favorites) { state = { urls: j.urls || [], favorites: j.favorites, recent: j.recent || [], last: j.last || '' }; saveState(); renderRecent(); renderGroups(); renderList(); return; } } catch {}
  openText(t, '');
  e.target.value = '';
};

(async function init() {
  loadState(); renderRecent();
  if (state.pub) loadPlaylist('public-channels.m3u', true);
  else if (state.urls[0]) loadPlaylist(state.urls[0]);
  else if (state.favorites.length) { group = FAV; renderList(); }
})();
</script>
</body>
